name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: uv sync --locked
      - run: just check
      - name: Audit locked dependencies
        run: |
          uv export --locked --no-emit-project --output-file "$RUNNER_TEMP/dependencies.txt" --quiet
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/dependencies.txt" --disable-pip
      - name: Generate a project
        run: uv run copier copy . "$RUNNER_TEMP/generated-service" --defaults --vcs-ref=HEAD -d project_name="Network Helper" -d project_slug=network-helper -d package_name=network_helper
      - name: Check generated project
        working-directory: ${{ runner.temp }}/generated-service
        run: |
          uv sync
          just check
          uv build
